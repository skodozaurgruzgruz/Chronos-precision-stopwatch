<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos — Precision Stopwatch</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter for UI, Roboto (standard Android font) for stopwatch digits -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration for Dark Mode & Custom Fonts -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        android: ['Roboto', 'Droid Sans', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#172033',
                            950: '#0B1120',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: rgba(226, 232, 240, 0.8);
        }

        [data-theme="dark"], html.dark {
            --bg-primary: #0B1120;
            --bg-card: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(30, 41, 59, 0.8);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .timer-card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
        }

        .tabular-android {
            font-family: 'Roboto', 'Droid Sans', system-ui, -apple-system, sans-serif;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-200 selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation / Header -->
    <header class="w-full max-w-2xl mx-auto px-4 sm:px-6 pt-6 pb-2 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-indigo-600 dark:bg-indigo-500 flex items-center justify-center text-white shadow-sm">
                <!-- Stopwatch Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <path d="M12 9v4l2 2"></path>
                    <path d="M5 3 2 6"></path>
                    <path d="m22 6-3-3"></path>
                    <path d="M6.38 18.7 4 21"></path>
                    <path d="M17.64 18.67 20 21"></path>
                </svg>
            </div>
            <h1 class="text-lg font-semibold tracking-tight text-slate-800 dark:text-slate-100">Chronos</h1>
        </div>

        <div class="flex items-center gap-2">
            <!-- Export / Copy Laps Button (Hidden until laps exist) -->
            <button id="export-btn" type="button" title="Copy laps to clipboard" class="hidden items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                </svg>
                <span id="export-text">Copy Laps</span>
            </button>

            <!-- Theme Toggle Button -->
            <button id="theme-toggle" type="button" aria-label="Switch to Dark Mode" title="Toggle Dark/Light Theme" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95 shadow-sm cursor-pointer">
                <!-- Sun Icon (shown in dark mode) -->
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="m4.93 4.93 1.41 1.41"></path>
                    <path d="m17.66 17.66 1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="m6.34 17.66-1.41 1.41"></path>
                    <path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
                <!-- Moon Icon (shown in light mode) -->
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 block text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Stopwatch Container -->
    <main class="w-full max-w-2xl mx-auto px-4 sm:px-6 my-auto py-4 flex flex-col gap-6">
        
        <!-- Timer Card -->
        <section class="timer-card bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-10 shadow-sm border border-slate-200/80 dark:border-slate-800/80 flex flex-col items-center justify-center relative overflow-hidden">
            
            <!-- Subtle Status Indicator Pill -->
            <div class="mb-4 sm:mb-6 flex items-center gap-2 px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700/60">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-400 transition-colors duration-300"></span>
                <span id="status-text" class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Ready</span>
            </div>

            <!-- Digital Time Display (Standard Android Roboto with Tabular Numerals) -->
            <div class="w-full text-center select-none my-2">
                <div class="tabular-android font-bold tracking-tight text-slate-900 dark:text-white flex items-baseline justify-center">
                    <!-- Hours -->
                    <span id="display-hours" class="text-4xl sm:text-6xl md:text-7xl">00</span>
                    <span class="text-3xl sm:text-5xl md:text-6xl text-slate-300 dark:text-slate-700 mx-0.5 sm:mx-1">:</span>
                    <!-- Minutes -->
                    <span id="display-minutes" class="text-4xl sm:text-6xl md:text-7xl">00</span>
                    <span class="text-3xl sm:text-5xl md:text-6xl text-slate-300 dark:text-slate-700 mx-0.5 sm:mx-1">:</span>
                    <!-- Seconds -->
                    <span id="display-seconds" class="text-4xl sm:text-6xl md:text-7xl">00</span>
                    <span class="text-2xl sm:text-4xl md:text-5xl text-indigo-500 dark:text-indigo-400 ml-1 sm:ml-1.5">.</span>
                    <!-- Centiseconds -->
                    <span id="display-ms" class="text-2xl sm:text-4xl md:text-5xl text-indigo-600 dark:text-indigo-400 font-medium w-[2.1ch] text-left">00</span>
                </div>
                
                <!-- Current Lap Live Sub-display (Visible once first lap is recorded) -->
                <div id="current-lap-container" class="h-6 mt-3 flex items-center justify-center gap-2 text-xs sm:text-sm text-slate-400 dark:text-slate-500 opacity-0 transition-opacity duration-200">
                    <span>Current Lap:</span>
                    <span id="current-lap-time" class="tabular-android text-slate-600 dark:text-slate-300 font-medium">00:00:00.00</span>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="w-full grid grid-cols-3 gap-3 sm:gap-4 mt-6 sm:mt-8 max-w-md">
                <!-- Reset Button -->
                <button id="btn-reset" type="button" disabled class="group flex flex-col items-center justify-center py-3.5 sm:py-4 px-4 rounded-2xl font-semibold text-sm sm:text-base bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-slate-400 cursor-pointer">
                    <span class="flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                        Reset
                    </span>
                    <kbd class="hidden sm:inline-block mt-1 text-[10px] font-mono font-normal px-1.5 py-0.5 rounded bg-slate-200/70 dark:bg-slate-700/70 text-slate-500 dark:text-slate-400">R</kbd>
                </button>

                <!-- Start / Pause Primary Button -->
                <button id="btn-start-pause" type="button" class="group flex flex-col items-center justify-center py-3.5 sm:py-4 px-4 rounded-2xl font-semibold text-sm sm:text-base bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-600/20 transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900 cursor-pointer">
                    <span id="start-pause-label" class="flex items-center gap-1.5">
                        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                        <span id="start-pause-text">Start</span>
                    </span>
                    <kbd class="hidden sm:inline-block mt-1 text-[10px] font-mono font-normal px-1.5 py-0.5 rounded bg-black/15 text-white/90">Space</kbd>
                </button>

                <!-- Lap Button -->
                <button id="btn-lap" type="button" disabled class="group flex flex-col items-center justify-center py-3.5 sm:py-4 px-4 rounded-2xl font-semibold text-sm sm:text-base bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200/60 dark:border-indigo-800/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 disabled:opacity-40 disabled:pointer-events-none transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                    <span class="flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                            <line x1="4" x2="4" y1="22" y2="15"></line>
                        </svg>
                        Lap
                    </span>
                    <kbd class="hidden sm:inline-block mt-1 text-[10px] font-mono font-normal px-1.5 py-0.5 rounded bg-indigo-200/50 dark:bg-indigo-800/50 text-indigo-600 dark:text-indigo-300">L</kbd>
                </button>
            </div>
        </section>

        <!-- Laps List Section -->
        <section id="laps-section" class="timer-card hidden bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm overflow-hidden flex-col">
            <!-- Table Header -->
            <div class="grid grid-cols-12 px-5 sm:px-6 py-3.5 bg-slate-50/80 dark:bg-slate-800/40 border-b border-slate-200/70 dark:border-slate-800 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                <div class="col-span-3 sm:col-span-3">Lap</div>
                <div class="col-span-5 sm:col-span-5 text-right">Split Time</div>
                <div class="col-span-4 sm:col-span-4 text-right">Total Time</div>
            </div>

            <!-- Scrollable Laps Container -->
            <div id="laps-list" class="max-h-64 sm:max-h-72 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/70 scroll-smooth">
                <!-- Lap items injected dynamically via JS -->
            </div>
        </section>

    </main>

    <!-- Subtle Footer with Keyboard Hints -->
    <footer class="w-full max-w-2xl mx-auto px-4 sm:px-6 py-5 text-center">
        <p class="hidden sm:flex items-center justify-center gap-4 text-xs text-slate-400 dark:text-slate-500">
            <span class="flex items-center gap-1.5">
                <kbd class="px-2 py-0.5 font-mono text-[11px] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-md shadow-2xs">Space</kbd>
                Start / Pause
            </span>
            <span class="flex items-center gap-1.5">
                <kbd class="px-2 py-0.5 font-mono text-[11px] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-md shadow-2xs">L</kbd>
                Record Lap
            </span>
            <span class="flex items-center gap-1.5">
                <kbd class="px-2 py-0.5 font-mono text-[11px] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-md shadow-2xs">R</kbd>
                Reset
            </span>
        </p>
        <p class="sm:hidden text-xs text-slate-400 dark:text-slate-500">
            High-precision millisecond stopwatch
        </p>
    </footer>

    <!-- Application Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            'use strict';

            // ==========================================
            // Safe Storage Helpers (Sandboxed iFrame Safe)
            // ==========================================
            function getSavedTheme() {
                try {
                    return window.localStorage.getItem('stopwatch-theme');
                } catch (e) {
                    return null;
                }
            }

            function saveTheme(theme) {
                try {
                    window.localStorage.setItem('stopwatch-theme', theme);
                } catch (e) {
                    // Ignore SecurityError in sandboxed environments
                }
            }

            // ==========================================
            // State Management
            // ==========================================
            let isRunning = false;
            let startTime = 0;          // Timestamp when current session started
            let elapsedTime = 0;        // Accumulated elapsed time in ms
            let lastLapTotalTime = 0;   // Total elapsed time at the previous lap
            let laps = [];              // Array of { lapNumber, splitTime, totalTime }
            let animationFrameId = null;

            // ==========================================
            // DOM Elements
            // ==========================================
            const displayHours = document.getElementById('display-hours');
            const displayMinutes = document.getElementById('display-minutes');
            const displaySeconds = document.getElementById('display-seconds');
            const displayMs = document.getElementById('display-ms');

            const currentLapContainer = document.getElementById('current-lap-container');
            const currentLapTimeEl = document.getElementById('current-lap-time');

            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            const btnStartPause = document.getElementById('btn-start-pause');
            const startPauseText = document.getElementById('start-pause-text');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const btnLap = document.getElementById('btn-lap');
            const btnReset = document.getElementById('btn-reset');

            const lapsSection = document.getElementById('laps-section');
            const lapsList = document.getElementById('laps-list');
            const exportBtn = document.getElementById('export-btn');
            const exportText = document.getElementById('export-text');
            const themeToggle = document.getElementById('theme-toggle');
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');

            // ==========================================
            // Theme Initialization & Toggle
            // ==========================================
            function applyTheme(isDark) {
                const root = document.documentElement;
                if (isDark) {
                    root.classList.add('dark');
                    root.classList.remove('light');
                    root.setAttribute('data-theme', 'dark');
                    if (sunIcon) {
                        sunIcon.classList.remove('hidden');
                        sunIcon.classList.add('block');
                    }
                    if (moonIcon) {
                        moonIcon.classList.add('hidden');
                        moonIcon.classList.remove('block');
                    }
                    if (themeToggle) {
                        themeToggle.setAttribute('aria-label', 'Switch to Light Mode');
                    }
                } else {
                    root.classList.remove('dark');
                    root.classList.add('light');
                    root.setAttribute('data-theme', 'light');
                    if (sunIcon) {
                        sunIcon.classList.add('hidden');
                        sunIcon.classList.remove('block');
                    }
                    if (moonIcon) {
                        moonIcon.classList.remove('hidden');
                        moonIcon.classList.add('block');
                    }
                    if (themeToggle) {
                        themeToggle.setAttribute('aria-label', 'Switch to Dark Mode');
                    }
                }
            }

            function initTheme() {
                const savedTheme = getSavedTheme();
                let prefersDark = false;
                try {
                    prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                } catch (e) {
                    prefersDark = false;
                }
                const shouldUseDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
                applyTheme(shouldUseDark);
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const currentlyDark = document.documentElement.classList.contains('dark') ||
                                          document.documentElement.getAttribute('data-theme') === 'dark';
                    const nextDark = !currentlyDark;
                    applyTheme(nextDark);
                    saveTheme(nextDark ? 'dark' : 'light');
                });
            }

            initTheme();

            // ==========================================
            // Time Formatting Helpers
            // ==========================================
            function padZero(num, digits = 2) {
                return String(num).padStart(digits, '0');
            }

            function getTimeParts(ms) {
                const safeMs = Math.max(0, ms);
                const totalCentiseconds = Math.floor(safeMs / 10);
                const centiseconds = totalCentiseconds % 100;
                const totalSeconds = Math.floor(safeMs / 1000);
                const seconds = totalSeconds % 60;
                const totalMinutes = Math.floor(totalSeconds / 60);
                const minutes = totalMinutes % 60;
                const hours = Math.floor(totalMinutes / 60);

                return {
                    hours: padZero(hours),
                    minutes: padZero(minutes),
                    seconds: padZero(seconds),
                    ms: padZero(centiseconds)
                };
            }

            function formatFullTime(ms) {
                const parts = getTimeParts(ms);
                return `${parts.hours}:${parts.minutes}:${parts.seconds}.${parts.ms}`;
            }

            // ==========================================
            // Display & UI State Updates
            // ==========================================
            function updateDisplay(currentTotalMs) {
                const parts = getTimeParts(currentTotalMs);
                if (displayHours) displayHours.textContent = parts.hours;
                if (displayMinutes) displayMinutes.textContent = parts.minutes;
                if (displaySeconds) displaySeconds.textContent = parts.seconds;
                if (displayMs) displayMs.textContent = parts.ms;

                if (laps.length > 0 && currentLapTimeEl) {
                    const currentSplit = currentTotalMs - lastLapTotalTime;
                    currentLapTimeEl.textContent = formatFullTime(currentSplit);
                }
            }

            function updateControlsUI() {
                if (!btnStartPause) return;

                if (isRunning) {
                    // Running state -> Button becomes "Pause" (Amber)
                    btnStartPause.classList.remove('bg-emerald-600', 'hover:bg-emerald-500', 'shadow-emerald-600/20', 'focus:ring-emerald-500');
                    btnStartPause.classList.add('bg-amber-500', 'hover:bg-amber-400', 'shadow-amber-500/20', 'focus:ring-amber-500');
                    if (startPauseText) startPauseText.textContent = 'Pause';
                    if (iconPlay) iconPlay.classList.add('hidden');
                    if (iconPause) iconPause.classList.remove('hidden');

                    // Status pill
                    if (statusDot) statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
                    if (statusText) {
                        statusText.textContent = 'Running';
                        statusText.className = 'text-xs font-medium uppercase tracking-wider text-emerald-600 dark:text-emerald-400';
                    }

                    // Enable Lap & Reset
                    if (btnLap) btnLap.disabled = false;
                    if (btnReset) btnReset.disabled = false;
                } else {
                    // Paused or Ready state -> Button becomes "Start" / "Resume" (Emerald)
                    btnStartPause.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'shadow-amber-500/20', 'focus:ring-amber-500');
                    btnStartPause.classList.add('bg-emerald-600', 'hover:bg-emerald-500', 'shadow-emerald-600/20', 'focus:ring-emerald-500');
                    if (startPauseText) startPauseText.textContent = elapsedTime > 0 ? 'Resume' : 'Start';
                    if (iconPause) iconPause.classList.add('hidden');
                    if (iconPlay) iconPlay.classList.remove('hidden');

                    // Disable Lap when paused
                    if (btnLap) btnLap.disabled = true;

                    if (elapsedTime > 0) {
                        if (statusDot) statusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
                        if (statusText) {
                            statusText.textContent = 'Paused';
                            statusText.className = 'text-xs font-medium uppercase tracking-wider text-amber-600 dark:text-amber-400';
                        }
                        if (btnReset) btnReset.disabled = false;
                    } else {
                        if (statusDot) statusDot.className = 'w-2 h-2 rounded-full bg-slate-400';
                        if (statusText) {
                            statusText.textContent = 'Ready';
                            statusText.className = 'text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400';
                        }
                        if (btnReset) btnReset.disabled = true;
                    }
                }
            }

            // ==========================================
            // High-Precision Animation Loop
            // ==========================================
            function tick() {
                if (!isRunning) return;
                const now = performance.now();
                const currentTotalMs = elapsedTime + (now - startTime);
                updateDisplay(currentTotalMs);
                animationFrameId = requestAnimationFrame(tick);
            }

            // ==========================================
            // Core Stopwatch Actions
            // ==========================================
            function toggleStartPause() {
                if (isRunning) {
                    // Pause
                    isRunning = false;
                    if (animationFrameId !== null) {
                        cancelAnimationFrame(animationFrameId);
                        animationFrameId = null;
                    }
                    elapsedTime += performance.now() - startTime;
                    updateDisplay(elapsedTime);
                } else {
                    // Start or Resume
                    isRunning = true;
                    startTime = performance.now();
                    animationFrameId = requestAnimationFrame(tick);
                }
                updateControlsUI();
            }

            function recordLap() {
                if (!isRunning) return;

                const currentTotalMs = elapsedTime + (performance.now() - startTime);
                const splitTime = currentTotalMs - lastLapTotalTime;
                lastLapTotalTime = currentTotalMs;

                laps.unshift({
                    lapNumber: laps.length + 1,
                    splitTime: splitTime,
                    totalTime: currentTotalMs
                });

                if (currentLapContainer) {
                    currentLapContainer.classList.remove('opacity-0');
                }
                if (currentLapTimeEl) {
                    currentLapTimeEl.textContent = '00:00:00.00';
                }
                renderLaps();
            }

            function resetStopwatch() {
                isRunning = false;
                if (animationFrameId !== null) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                startTime = 0;
                elapsedTime = 0;
                lastLapTotalTime = 0;
                laps = [];

                updateDisplay(0);
                updateControlsUI();

                if (currentLapContainer) currentLapContainer.classList.add('opacity-0');
                if (currentLapTimeEl) currentLapTimeEl.textContent = '00:00:00.00';
                if (lapsSection) {
                    lapsSection.classList.add('hidden');
                    lapsSection.classList.remove('flex');
                }
                if (exportBtn) {
                    exportBtn.classList.add('hidden');
                    exportBtn.classList.remove('flex');
                }
                if (lapsList) lapsList.innerHTML = '';
            }

            // ==========================================
            // Render Laps with Fastest / Slowest Badges
            // ==========================================
            function renderLaps() {
                if (laps.length === 0 || !lapsList) return;

                if (lapsSection) {
                    lapsSection.classList.remove('hidden');
                    lapsSection.classList.add('flex');
                }
                if (exportBtn) {
                    exportBtn.classList.remove('hidden');
                    exportBtn.classList.add('flex');
                }

                // Determine fastest and slowest split times when >= 2 laps exist
                let minSplit = Infinity;
                let maxSplit = -Infinity;

                if (laps.length >= 2) {
                    laps.forEach(lap => {
                        if (lap.splitTime < minSplit) minSplit = lap.splitTime;
                        if (lap.splitTime > maxSplit) maxSplit = lap.splitTime;
                    });
                }

                const html = laps.map((lap) => {
                    const isFastest = laps.length >= 2 && lap.splitTime === minSplit;
                    const isSlowest = laps.length >= 2 && lap.splitTime === maxSplit && minSplit !== maxSplit;

                    let rowHighlight = 'hover:bg-slate-50 dark:hover:bg-slate-800/40';
                    let splitTextColor = 'text-slate-800 dark:text-slate-200';
                    let badgeHtml = '';

                    if (isFastest) {
                        rowHighlight = 'bg-emerald-50/70 dark:bg-emerald-950/30';
                        splitTextColor = 'text-emerald-600 dark:text-emerald-400 font-semibold';
                        badgeHtml = `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-sans font-semibold bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300">Fastest</span>`;
                    } else if (isSlowest) {
                        rowHighlight = 'bg-rose-50/70 dark:bg-rose-950/30';
                        splitTextColor = 'text-rose-600 dark:text-rose-400 font-semibold';
                        badgeHtml = `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-sans font-semibold bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300">Slowest</span>`;
                    }

                    return `
                        <div class="grid grid-cols-12 items-center px-5 sm:px-6 py-3.5 text-sm tabular-android transition-colors ${rowHighlight}">
                            <div class="col-span-3 sm:col-span-3 flex items-center text-slate-500 dark:text-slate-400 font-medium">
                                <span>#${padZero(lap.lapNumber)}</span>
                                ${badgeHtml}
                            </div>
                            <div class="col-span-5 sm:col-span-5 text-right ${splitTextColor}">
                                +${formatFullTime(lap.splitTime)}
                            </div>
                            <div class="col-span-4 sm:col-span-4 text-right text-slate-600 dark:text-slate-400">
                                ${formatFullTime(lap.totalTime)}
                            </div>
                        </div>
                    `;
                }).join('');

                lapsList.innerHTML = html;
            }

            // ==========================================
            // Copy Laps to Clipboard
            // ==========================================
            function copyLapsToClipboard() {
                if (laps.length === 0) return;

                const orderedLaps = [...laps].reverse();
                const lines = ['Lap\tSplit Time\tTotal Time'];
                orderedLaps.forEach(lap => {
                    lines.push(`#${padZero(lap.lapNumber)}\t${formatFullTime(lap.splitTime)}\t${formatFullTime(lap.totalTime)}`);
                });
                const textToCopy = lines.join('\n');

                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();

                try {
                    document.execCommand('copy');
                    if (exportText) {
                        const originalText = exportText.textContent;
                        exportText.textContent = 'Copied!';
                        setTimeout(() => {
                            exportText.textContent = originalText;
                        }, 1800);
                    }
                } catch (err) {
                    // Fallback ignored
                } finally {
                    document.body.removeChild(textarea);
                }
            }

            // ==========================================
            // Event Listeners
            // ==========================================
            if (btnStartPause) {
                btnStartPause.addEventListener('click', toggleStartPause);
            }

            if (btnLap) {
                btnLap.addEventListener('click', recordLap);
            }

            if (btnReset) {
                btnReset.addEventListener('click', resetStopwatch);
            }

            if (exportBtn) {
                exportBtn.addEventListener('click', copyLapsToClipboard);
            }

            // Keyboard Shortcuts (Space = Start/Pause, L = Lap, R = Reset)
            document.addEventListener('keydown', (e) => {
                const tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) {
                    return;
                }

                if (e.code === 'Space') {
                    e.preventDefault();
                    toggleStartPause();
                } else if (e.key === 'l' || e.key === 'L') {
                    if (isRunning) {
                        e.preventDefault();
                        recordLap();
                    }
                } else if (e.key === 'r' || e.key === 'R') {
                    if (isRunning || elapsedTime > 0) {
                        e.preventDefault();
                        resetStopwatch();
                    }
                }
            });
        });
    </script>
</body>
</html>
